<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="description" content="Square photo camera with a donut framing guide.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Donut Camera">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Donut Camera</title>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.69"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.2 6.2A8.2 8.2 0 0 1 20 12M4 12a8.2 8.2 0 0 0 13.8 5.8"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H4v11h16V10h-3"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  </svg>

  <main class="app" data-state="idle">
    <header class="topbar">
      <h1 class="sr-only">Donut Camera</h1>
      <label class="lens-picker" for="lens-select"><svg aria-hidden="true"><use href="#i-camera"/></svg><select id="lens-select" disabled aria-label="Camera lens"><option>Back camera</option></select></label>
    </header>

    <section class="camera-area" aria-label="Camera">
      <video id="ambient-camera" class="ambient" autoplay muted playsinline disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <img id="ambient-photo" class="ambient" alt="" hidden>
      <div class="viewfinder" id="viewfinder">
        <video id="camera" autoplay muted playsinline disablepictureinpicture aria-label="Live camera preview"></video>
        <img id="photo" alt="Your captured square photo" hidden>
        <canvas id="frozen-frame" aria-hidden="true" hidden></canvas>
        <svg id="guide" class="guide" viewBox="0 0 1000 1000" aria-hidden="true">
          <defs><mask id="ring-mask"><rect width="1000" height="1000" fill="white"/><circle cx="500" cy="500" r="500" fill="black"/><circle cx="500" cy="500" r="205" fill="white"/></mask></defs>
          <rect width="1000" height="1000" class="guide-shade" mask="url(#ring-mask)"/>
          <circle class="guide-line" cx="500" cy="500" r="499"/>
          <circle class="guide-line hole-line" cx="500" cy="500" r="205"/>
        </svg>
        <button class="guide-toggle" id="guide-toggle" aria-label="Show donut guide" aria-pressed="false" hidden><svg><use href="#i-ring"/></svg> Guide</button>
        <div class="camera-gate" id="camera-gate">
          <p id="gate-copy" hidden></p>
          <button class="primary-button" id="start-button"><svg aria-hidden="true"><use href="#i-camera"/></svg><span id="start-label">Open camera</span></button>
        </div>
        <div class="capture-progress" id="capture-progress" role="status" hidden><span class="spinner"></span><span id="capture-label">Processing photo…</span></div>
      </div>
    </section>

    <div class="control-panel">
    <section class="controls" id="live-controls" aria-label="Photo controls">
      <div class="zoom-row" id="zoom-panel" hidden>
        <label for="zoom" id="zoom-mode">Digital zoom</label>
        <button class="reset-button" id="reset-zoom" aria-label="Reset zoom" disabled>Reset</button>
        <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom" disabled>
      </div>
      <div class="shutter-row">
        <button class="icon-button flip-button" id="flip-button" aria-label="Switch to selfie camera" disabled><svg><use href="#i-flip"/></svg></button>
        <button class="shutter" id="shutter" aria-label="Take photo" disabled><span></span></button>
        <button class="zoom-button" id="zoom-toggle" aria-label="Adjust zoom" aria-expanded="false" aria-controls="zoom-panel" disabled><output id="zoom-value" for="zoom">1.0×</output></button>
      </div>
    </section>

    <section class="review-controls" id="review-controls" aria-label="Photo review" hidden>
      <div class="photo-details"><span id="photo-size"></span><span id="photo-quality">JPEG</span></div>
      <button class="primary-button save-button" id="save-button"><svg><use href="#i-share"/></svg> Save photo</button>
      <button class="text-button" id="retake-button">Retake</button>
      <div class="save-fallback" id="save-fallback" hidden><p>Open the image, then touch and hold it to save to Photos. Download saves a copy to Files.</p><a id="open-image" target="_blank" rel="noopener">Open image</a><a id="download-image" download>Download JPEG</a></div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
  </main>

  <noscript><p class="noscript">Enable JavaScript to use Donut Camera.</p></noscript>
</body>
</html>
